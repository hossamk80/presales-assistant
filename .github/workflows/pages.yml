# نشر وثائق المشروع على GitHub Pages
#
# المصدر مجلد `docs/` وحده — لا الشيفرة ولا بيانات العطاءات. والمستودع عامّ
# أصلاً، فالنشر لا يكشف ما لم يكن مكشوفاً.
#
# **تفعيل Pages أول مرة نقرةٌ يدوية لا مفرّ منها**: إنشاء الموقع يحتاج صلاحية
# إدارة المستودع، و`GITHUB_TOKEN` لا يملكها — و`enablement: true` تفشل بـ
# «Resource not accessible by integration». فالمرة الأولى:
#
#     Settings ← Pages ← Build and deployment ← Source: **GitHub Actions**
#
# وبعدها ينشر هذا الملف مع كل دفعة بلا تدخّل.
name: نشر الوثائق

on:
  push:
    branches: [main]
    # لا يعمل إلا حين تتغيّر الوثائق فعلاً — دفعةٌ تمسّ الشيفرة وحدها لا
    # تُشغّل نشراً بلا جديد.
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# نشرةٌ واحدة في كل لحظة، ولا تُلغى الجارية: نصف موقع منشور أسوأ من نشرة
# تنتظر دورها.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: بناء ونشر
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: تهيئة Pages
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: تعليمات التفعيل إن لم يكن مفعّلاً
        # الفشل بلا تفسير يُقرأ عطلاً في الشيفرة، والعلّة إعدادٌ لم يُفتح بعد.
        if: steps.pages.outcome == 'failure'
        run: |
          echo "::error::GitHub Pages غير مفعّل لهذا المستودع."
          echo "افتح: Settings ← Pages ← Build and deployment"
          echo "واختر Source: GitHub Actions ثم أعد تشغيل هذه النشرة."
          exit 1

      - name: التحقّق من اكتمال الوثائق قبل النشر
        # موقعٌ يُنشر بملف أنماط مفقود أو خطّ مفقود يخرج بلا هوية ولا يُلاحَظ
        # إلا بعد أن يُشارَك الرابط.
        run: |
          for f in index.html status.html guide.html manual.html \
                   assets/report.css \
                   assets/fonts/IBMPlexSansArabic-Regular.woff2 \
                   assets/fonts/IBMPlexSansArabic-SemiBold.woff2; do
            test -f "docs/$f" || { echo "❌ ناقص: docs/$f"; exit 1; }
          done
          echo "✅ كل ملفات الموقع موجودة"

      - name: رفع مجلد الوثائق
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: النشر
        id: deployment
        uses: actions/deploy-pages@v4
