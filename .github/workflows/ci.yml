name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: presales_codex_ready/business_analyst

jobs:
  test:
    name: اختبارات (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: تهيئة Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: presales_codex_ready/business_analyst/requirements.txt

      - name: حزم النظام (خط عربي لتصدير PDF + أدوات OCR)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            fonts-dejavu-core tesseract-ocr tesseract-ocr-ara poppler-utils

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          pip install -r "$APP_DIR/requirements.txt"
          pip install pytest pytest-timeout
          # اختيارية: تفعّل مسار OCR في الاختبارات
          pip install pytesseract pdf2image

      - name: فحص بناء الجملة لكل الملفات
        # -x يستثني بيئة افتراضية محلية إن وُجدت (غير موجودة في CI)
        run: python -m compileall -q -x '(\.venv|__pycache__)' "$APP_DIR"

      - name: تشغيل الاختبارات
        working-directory: presales_codex_ready/business_analyst
        run: python -m pytest tests/ -v --timeout=300

  boot:
    name: إقلاع التطبيق فعلياً
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: presales_codex_ready/business_analyst/requirements.txt

      - name: حزم النظام
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          pip install -r "$APP_DIR/requirements.txt"

      - name: تشغيل الخادم والتحقق من استجابته
        run: |
          streamlit run "$APP_DIR/app.py" \
            --server.address 0.0.0.0 --server.port 8501 --server.headless true \
            > /tmp/streamlit.log 2>&1 &

          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8501/; then
              echo "✅ التطبيق يستجيب بعد ${i} ثانية"
              exit 0
            fi
            sleep 1
          done

          echo "❌ التطبيق لم يستجب خلال 30 ثانية"
          cat /tmp/streamlit.log
          exit 1

      - name: سجلّ الخادم عند الفشل
        if: failure()
        run: cat /tmp/streamlit.log || true
