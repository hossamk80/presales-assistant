name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: اختبارات (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: تهيئة Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            constraints.txt

      - name: حزم النظام (خط عربي لتصدير PDF + أدوات OCR)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            fonts-dejavu-core tesseract-ocr tesseract-ocr-ara poppler-utils

      - name: تثبيت المكتبات
        # `-c constraints.txt` يثبّت النسخ — المباشرة وغير المباشرة معاً.
        # بدونه كانت خضرة CI رهينة يوم التشغيل لا حالة الشيفرة.
        #
        # وأدوات الفحص من `requirements-dev.txt` لا مكتوبةً هنا: كانت أسماؤها
        # في ثلاثة مواضع، فأداةٌ تُضاف في أحدها وتُنسى في الآخرين.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt

      - name: فحص بناء الجملة لكل الملفات
        # -x يستثني بيئة افتراضية محلية إن وُجدت (غير موجودة في CI)
        run: python -m compileall -q -x '(\.venv|__pycache__)' .

      - name: فحص pyflakes
        # `compileall` يقبل ما يقبله المفسّر، والاختبارات تمرّ بصمت على
        # **مفتاح مكرّر في قاموس** — وهو عطبنا المتكرّر: تصادم أسماء نطاقات
        # `utils/i18n.py` (`pm.` · `cs.` · `dm.`) لم يكشفه إلا pyflakes.
        # الأداة التي تجد عطبنا الأكثر تكراراً يجب أن تحرس `main`.
        run: python -m pyflakes app.py utils views components tests scripts

      - name: تشغيل الاختبارات مع قياس التغطية
        run: |
          python -m pytest tests/ -v --timeout=300 \
            --cov --cov-report=term --cov-report=json:coverage.json

      - name: أرضيات التغطية لكل طبقة
        # رقمٌ عامٌّ واحد يجعل ارتفاع `views` يغطّي انخفاض `utils` — فيُرى
        # مستقراً والمنطق يتعرّى. الأرضيات لكل طبقة في السكربت، وهي **مقيسة**.
        run: python scripts/check_coverage.py coverage.json

  boot:
    name: إقلاع التطبيق فعلياً
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: حزم النظام
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-dejavu-core

      - name: تثبيت المكتبات
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: تشغيل الخادم والتحقق من استجابته
        run: |
          streamlit run app.py \
            --server.address 0.0.0.0 --server.port 8501 --server.headless true \
            > /tmp/streamlit.log 2>&1 &

          for i in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:8501/; then
              echo "✅ التطبيق يستجيب بعد ${i} ثانية"
              exit 0
            fi
            sleep 1
          done

          echo "❌ التطبيق لم يستجب خلال 30 ثانية"
          cat /tmp/streamlit.log
          exit 1

      - name: سجلّ الخادم عند الفشل
        if: failure()
        run: cat /tmp/streamlit.log || true
