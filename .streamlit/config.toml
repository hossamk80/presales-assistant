# إعدادات Streamlit. يُقرأ من مجلد العمل، والتشغيل من جذر المستودع.
#
# كان هناك ملفان: هذا، وآخر داخل مجلد التطبيق يحمل السمة الصحيحة. والتشغيل من
# الجذر يعني أن **سمة هذا الملف وحدها كانت تسري** — بألوانٍ لا تطابق
# `components/theme.py`. دُمجا هنا بعد نقل التطبيق إلى الجذر، والسمة أدناه هي
# سمة التطبيق الفعلية.

[server]
address = "0.0.0.0"
port = 8501
headless = true

# Replit يقدّم التطبيق عبر وكيل على نطاق مختلف، فتعطيل فحص CORS ضروري
# ليعمل اتصال WebSocket. حماية XSRF تبقى مفعّلة.
enableCORS = false
enableXsrfProtection = true

# كراسات الشروط ومرفقاتها قد تتجاوز الحد الافتراضي (200MB)
maxUploadSize = 400

# خدمة الملفات الساكنة — الخطّ العربي يُقدَّم من `static/` بجوار `app.py` (ب-1).
# كان يُستدعى حيّاً من `fonts.googleapis.com`، فأي تركيب معزول عن الإنترنت
# يفقده. تعطيل هذا المفتاح يُسقط الواجهة إلى خط النظام ولا يكسرها.
enableStaticServing = true

[browser]
gatherUsageStats = false

# السمة الأساسية. الألوان هنا هي نفسها في `components/theme.py`: عناصر
# Streamlit الداخلية (تحديد التبويب، مربّع الاختيار، المنزلق، أزرار النماذج)
# تُلوَّن من السمة لا من CSS المحقون — فلو خالفتها ظهرت ألوان غريبة وسط
# الهوية الزرقاء.
[theme]
base = "light"
primaryColor = "#2270c1"
backgroundColor = "#f8fafc"
secondaryBackgroundColor = "#ffffff"
textColor = "#111827"
font = "sans serif"

[client]
toolbarMode = "minimal"
